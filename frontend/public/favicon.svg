<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a89cff"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond sombre -->
  <rect width="38" height="38" fill="#050508" rx="8"/>

  <!-- Diamond border -->
  <path d="M19 2 L36 19 L19 36 L2 19 Z"
    stroke="url(#g)" stroke-width="1.2" fill="none" filter="url(#glow)"/>

  <!-- Lettre A gauche -->
  <path d="M10 30 L16 10 M16 10 L19 18 M12.2 23 L17.8 23"
    stroke="url(#g)" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Lettre A droite -->
  <path d="M19 18 L22 10 M22 10 L28 30 M20.2 23 L25.8 23"
    stroke="url(#g)" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
